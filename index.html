<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In – Account – Windy.com</title>
    <link rel="stylesheet" href="Styles/style.css">
    <link rel="icon" type="image/x-icon" href="Images/favicon.png">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="Scripts/submit.js" defer></script>
</head>

<body>
    <main>
        <div class="main-top">
            <img class="logo" src="Images/logo.png" width="60" height="60">
            <img class="logo" src="Images/logo-text-windycom-white.svg" height="45">
        </div>
        <section class="form-container">
            <form novalidate aria-live="polite">
                <div class="inputField">
                    <label for="email">Email</label>
                    <br>
                    <input type="email" id="email" name="email" required autofocus>
                </div>
                <div class="inputField">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                    
                    <a href="#" id="right">Forgot password?</a>
                    <br>
                </div>
                <button type="submit" id="submit">Sign in</button>
            </form>
            <div class="line-container">
                <div class="line"></div>
                <div class="or">or</div>
                <div class="line"></div>
            </div>

            <div class="sign-ins">
                <a href="#"><div class="signIn" id="appleSignIn"><img class="sign-in-icon" src="Images/apple-logo.svg" alt="" aria-hidden="true">Sign in with Apple</div></a>
                <a href="#"><div class="signIn" id="googleSignIn"><img class="sign-in-icon" src="Images/Google_Favicon_2025.svg.webp" alt="" aria-hidden="true">Sign in with Google</div></a>
                <a href="#"><div class="signIn" id="facebookSignIn"><img class="sign-in-icon" src="Images/facebook-white.svg" alt="" aria-hidden="true">Sign in with Facebook</div></a>
            </div>
            
            <a href="#" id="signUp">Don't have an account? Sign up.</a>
        </section>
        <footer>
            <a href="#" class="footer-link">Privacy policy</a>
            <a href="#" class="footer-link">Terms of use</a>
            <a href="#" class="footer-link">FAQ</a>
            <button id="settings-button"><img src="Images/cog.svg" alt="Settings"></button>
        </footer>
    </main>
</body>
</html>
