<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In – Account – Windy.com</title>
    <link rel="stylesheet" href="Styles/style.css">
    <link rel="icon" type="image/x-icon" href="Images/favicon.png">

</head>
<body>
    <main>
        <div class="main-top">
            <img class="logo" src="Images/logo.png" width="60" height="60">
            <img class="logo" src="Images/logo-text-windycom-white.svg" height="45">
        </div>
        <section class="form-container">
            <form>
                <div class="inputField">
                    <label for="email">Email</label>
                    <br>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="inputField">
                    <label for="password">Password</label>
                    <br>
                    <input type="password" id="password" name="password" required>
                    <br>
                    <a href="#" id="right">Forgot password?</a>
                </div>
                <br><br>
                <button type="submit" id="submit">Sign in</button>
            </form>
            
            <div class="sign-ins">
                <a href="#"><div class="signIn" id="appleSignIn"><img src>Sign in with Apple</div></a>
                <a href="#"><div class="signIn" id="googleSignIn">Sign in with Google</div></a>
                <a href="#"><div class="signIn" id="facebookSignIn">Sign in with Facebook</div></a>
            </div>
            <a href="#"><div class="signUp" id="signUp">Don't have an account? Sign up</div></a>
        </section>
    </main>
    
</body>
</html>
